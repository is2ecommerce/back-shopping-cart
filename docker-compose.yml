version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: shopping-cart-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass securepassword
    volumes:
      - redis-data:/data
    networks:
      - shopping-cart-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "securepassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
    driver: local

networks:
  shopping-cart-network:
    driver: bridge
